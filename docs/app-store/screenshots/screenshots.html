<!doctype html>
<!--
  App Store 用スクリーンショット（10 枚）の元。scripts/render-app-store-screenshots.sh が Chrome のヘッドレスで開いて実寸で書き出す。
  直接開くときは screenshots.html?slide=1&lang=ja&device=iphone のように指定する。同じフォルダに次のファイルが要る:
    raw/<名前>.png        UI テスト（AppStoreScreenshotTests）で撮った画面。名前は添付の名前（detail・home-screen など）
    raw/layout.js         ホーム画面のアイコンの位置（home-screen-layout の JSON を window.HOME_LAYOUT に入れたもの）
    surfaces/<名前>.png   本物の View から描き出したウィジェット・ロック画面のアクセサリ・通知（AppStoreSurfaceRenderingTests）
    fonts/                Kaisei Decol（日本語の見出し）と Outfit（数字・ラテン文字の見出し）
    copy.js               見出しと小見出し（12 言語）

  方針（Issue #282）
  - アプリの中の画面は Simulator で動かした実物の画面をそのまま使う（審査ガイドライン 2.3）。ここで描き直さない
  - アプリの外の面は、Simulator で撮ったホーム画面・ロック画面に、本物の View から描き出したウィジェットを、アイコンの並びに合わせて重ねる。
    ライブアクティビティ（ロック画面・Dynamic Island）は、Simulator で実際に出したものが写っている。通知は ReminderContent の実際の文面で描き出して重ねる
  - 地はテーマ（地雷系・ゴシック。docs/design/themes.md）のダークの地に十字とハートの模様。枚ごとに推し色を替え、ピンクに偏らせない。
    10 枚目だけライトの地（ライトの外観の画面）
  - 見出しは日本語だけ Kaisei Decol の太字（アプリの本文と同じく、ほかの言語はその言語の字形のある書体）。価格は入れない。Plus の枚には「PLUS」の印
  - 配色・模様・印・端末の枠の描き方は、デザインキャンバス「推し活カウントダウン 画面デザイン」のストア画像の案（store.css）にそろえた
-->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Kaisei Decol"; font-weight: 700; src: url("fonts/KaiseiDecol-Bold.ttf"); }
  @font-face { font-family: "Kaisei Decol"; font-weight: 400; src: url("fonts/KaiseiDecol-Regular.ttf"); }
  @font-face { font-family: "Outfit"; font-weight: 100 900; src: url("fonts/Outfit-Variable.ttf"); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  .shot { position: relative; width: 100vw; height: 100vh; overflow: hidden; background: var(--bg); color: var(--title);
    font-family: "Outfit", "SF Pro Display", "Hiragino Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body[data-lang="ja"] .shot { font-family: "Kaisei Decol", "Hiragino Mincho ProN", serif; }
  body[data-lang="zh-Hans"] .shot { font-family: "Outfit", "PingFang SC", sans-serif; }
  body[data-lang="zh-Hant"] .shot { font-family: "Outfit", "PingFang TC", sans-serif; }
  body[data-lang="ko"] .shot { font-family: "Outfit", "Apple SD Gothic Neo", sans-serif; }
  body[data-lang="th"] .shot { font-family: "Outfit", "Sukhumvit Set", "Thonburi", sans-serif; }
  .pattern { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* 下に向かって推し色をほのかに灯す */
  .glow { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 45% at 50% 100%, var(--glow), transparent 70%); }

  .head { position: absolute; left: 0; right: 0; text-align: center; display: flex; flex-direction: column; align-items: center; }
  .title { font-weight: 700; line-height: 1.28; letter-spacing: 0.01em; color: var(--title); text-wrap: balance; }
  .title em { font-style: normal; color: var(--brand); }
  .sub { color: var(--muted); line-height: 1.55; text-wrap: balance; font-weight: 500; }
  body[data-lang="ja"] .sub { font-weight: 400; }

  /* 端末。枠の太さ・角の丸みは JavaScript（device）で端末の幅から決める */
  .device { position: absolute; background: #050305; }
  .device .screen { position: relative; overflow: hidden; width: 100%; height: 100%; }
  .device .screen > img.base { display: block; width: 100%; height: 100%; }
  .device .overlay { position: absolute; display: block; }
  .device .island { position: absolute; left: 50%; transform: translateX(-50%); background: #000; }

  .plus { position: absolute; display: inline-flex; align-items: center; background: var(--brand); color: var(--onBrand);
    font-family: "Outfit", sans-serif; font-weight: 800; letter-spacing: 0.14em; }
  .plus svg { fill: var(--onBrand); }
  .devices { display: inline-flex; align-items: center; justify-content: center; color: var(--brand); }
  .devices svg { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
</style>
<script src="copy.js"></script>
<script src="raw/layout.js" onerror="window.HOME_LAYOUT = null"></script>
</head>
<body>
<div class="shot" id="shot"></div>
<script>
  const params = new URLSearchParams(location.search);
  const slideNumber = Number(params.get("slide") || "1");
  const lang = params.get("lang") || "ja";
  // iphone・ipad・duo（端末の枠の形と、重ねる位置の決め方が変わる）
  const deviceKind = params.get("device") || "iphone";
  document.body.dataset.lang = lang;

  // 枚ごとの色（デザインキャンバスのストア画像の案の配色）。bg: 地、cross: 模様、brand: 強調、onBrand: 強調の上の文字、muted: 小見出し
  const PALETTES = {
    pink: { bg: "#120D12", cross: "#3A2231", brand: "#FF7EB3", onBrand: "#3A0A20", muted: "#D6B9C8", glow: "rgba(255, 126, 179, 0.22)" },
    chocomint: { bg: "#0C0F13", cross: "#1E3038", brand: "#60BDCB", onBrand: "#03252B", muted: "#B5CDD3", glow: "rgba(96, 189, 203, 0.2)" },
    green: { bg: "#0D0F11", cross: "#21302E", brand: "#6ABC9D", onBrand: "#06281D", muted: "#B8CEC6", glow: "rgba(106, 188, 157, 0.2)" },
    blue: { bg: "#0D0F15", cross: "#232E45", brand: "#7CB2FF", onBrand: "#0A1F44", muted: "#BBC6DA", glow: "rgba(124, 178, 255, 0.2)" },
    navy: { bg: "#0E0E14", cross: "#262840", brand: "#8693F6", onBrand: "#12184A", muted: "#BFC2DD", glow: "rgba(134, 147, 246, 0.22)" },
    red: { bg: "#120D10", cross: "#3F2427", brand: "#FF817D", onBrand: "#3D0A08", muted: "#D9BABA", glow: "rgba(255, 129, 125, 0.2)" },
    orange: { bg: "#120E0C", cross: "#3D2A1E", brand: "#F5A66B", onBrand: "#3A1A05", muted: "#D9C2B0", glow: "rgba(245, 166, 107, 0.2)" },
    // 10 枚目（ライトの外観）。出荷するテーマのライトの地（creative.html と同じ）
    light: { bg: "#FFF0F5", cross: "#F6D3E2", brand: "#C2185B", onBrand: "#FFFFFF", muted: "#5A3A4C", glow: "rgba(194, 24, 91, 0.16)", title: "#1A0F16" },
  };

  // 10 枚。layout が端末の並べ方、screens が使う画面（raw/ の名前）、overlays がホーム画面・ロック画面に重ねるもの
  const SLIDES = [
    { palette: "pink", layout: "single", screens: ["home-screen"], overlays: "homeWidgets", island: false },
    { palette: "navy", layout: "single", screens: ["lock-screen"], overlays: "lockAccessories", island: false,
      // iPhone Duo は UI テストからロックできないので、ライブアクティビティが右の帯に出ているホーム画面を使う
      duo: { screens: ["home-screen"], overlays: null } },
    { palette: "orange", layout: "single", screens: ["detail"] },
    { palette: "chocomint", layout: "trio", screens: ["theme-2", "theme-1", "theme-3"] },
    { palette: "red", layout: "pair", screens: ["appearance-home", "appearance-settings"], plus: true },
    { palette: "blue", layout: "single", screens: ["home-screen"], overlays: "photoWidgets", island: false, plus: true },
    { palette: "green", layout: "single", screens: ["share-card"] },
    { palette: "navy", layout: "single", screens: ["lock-screen-plain"], overlays: "lockNotifications", island: false,
      // iPhone Duo はロック画面を撮れないので、ホーム画面の上に通知のバナーを 1 つ重ねる
      duo: { screens: ["home-screen"], overlays: "bannerNotification" } },
    { palette: "pink", layout: "single", screens: ["oshi-list"] },
    { palette: "light", layout: "single", screens: ["home-light"], devices: true },
  ];

  // 端末ごとの差し替え（duo など）があれば重ねる
  const baseSlide = SLIDES[slideNumber - 1];
  const slide = baseSlide && { ...baseSlide, ...(baseSlide[deviceKind] || {}) };
  const copy = (window.SCREENSHOT_COPY || {})[lang];
  if (!slide || !copy || !copy[slideNumber - 1]) {
    document.body.innerHTML = `<h1 style="color:red;font-size:120px">No slide ${slideNumber} / copy for "${lang}"</h1>`;
    throw new Error(`screenshots.html に ${slideNumber} 枚目（${lang}）がありません`);
  }
  // 見出しにも端末ごとの差し替え（copy.js の duo）があれば重ねる
  const text = { ...copy[slideNumber - 1], ...(copy[slideNumber - 1][deviceKind] || {}) };
  const palette = PALETTES[slide.palette];
  const shot = document.getElementById("shot");
  for (const [key, value] of Object.entries({ ...palette, title: palette.title || "#FFFFFF" })) {
    shot.style.setProperty(`--${key}`, value);
  }

  const W = innerWidth, H = innerHeight;
  // 描く単位。デザインキャンバスの 440×956（6.9 inch の iPhone の pt）を基準にし、横長の iPad では高さに合わせる
  const u = Math.min(W / 440, H / 956);
  const add = (html, parent = shot) => { parent.insertAdjacentHTML("beforeend", html); return parent.lastElementChild; };
  const load = (src) => new Promise((resolve, reject) => {
    const image = new Image();
    image.onload = () => resolve(image);
    image.onerror = () => reject(new Error(`${src} を読めません`));
    image.src = src;
  });

  main().catch((error) => {
    document.body.innerHTML = `<h1 style="color:red;font-size:80px">${error.message}</h1>`;
    throw error;
  });

  async function main() {
    await document.fonts.ready;
    drawPattern();
    add(`<div class="glow"></div>`);
    const headBottom = drawHead();
    const images = await Promise.all(slide.screens.map((name) => load(`raw/${name}.png`)));
    const top = headBottom + 34 * u;
    const bottom = H - 26 * u;
    const devices = placeDevices(images, top, bottom);
    if (slide.overlays) {
      await OVERLAYS[slide.overlays](devices[0]);
    }
    if (slide.plus) {
      drawPlusBadge();
    }
    document.body.dataset.ready = "true";
  }

  // 十字とハートの模様（ThemePhotoPlaceholder と同じ形。64 の格子）
  function drawPattern() {
    const size = 64 * u;
    add(`<svg class="pattern" aria-hidden="true"><defs><pattern id="pt" width="${size}" height="${size}" patternUnits="userSpaceOnUse">` +
      `<g transform="scale(${u})"><path d="M16 7v16M8 15h16" stroke="var(--cross)" stroke-width="2.6" stroke-linecap="round" fill="none"></path>` +
      `<path d="M48 55c-6.5-4.3-9.5-7.6-9.5-11.2a4.6 4.6 0 0 1 9.5-1.6 4.6 4.6 0 0 1 9.5 1.6c0 3.6-3 6.9-9.5 11.2z" fill="var(--cross)"></path></g>` +
      `</pattern></defs><rect width="100%" height="100%" fill="url(#pt)"></rect></svg>`);
  }

  // 見出しと小見出し。中国語と日本語は <br> で改行し、ほかの言語は幅で折り返す。収まらなければ文字を縮める
  function drawHead() {
    const isCJK = ["ja", "zh-Hans", "zh-Hant"].includes(lang);
    const title = isCJK ? text.t : text.t.replaceAll("<br>", " ");
    const width = Math.min(W - 48 * u, 400 * u);
    const head = add(`<div class="head" style="top:${46 * u}px;gap:${12 * u}px">` +
      (slide.devices ? `<div class="devices">${deviceIcons()}</div>` : "") +
      `<h1 class="title" style="font-size:${34 * u}px;max-width:${width}px">${title}</h1>` +
      `<p class="sub" style="font-size:${14.5 * u}px;max-width:${width}px">${text.s}</p></div>`);
    const titleElement = head.querySelector(".title");
    // 見出しは 3 行まで
    for (let size = 34; titleElement.getBoundingClientRect().height > 34 * u * 1.28 * 3 + 1 && size > 22; size -= 1) {
      titleElement.style.fontSize = `${size * u}px`;
    }
    return head.getBoundingClientRect().bottom;
  }

  // iPhone・iPad・iPhone Duo の線の絵（10 枚目）
  function deviceIcons() {
    const s = 26 * u, w = 1.8;
    const phone = `<svg width="${s * 0.62}" height="${s}" viewBox="0 0 16 26" stroke-width="${w}"><rect x="1" y="1" width="14" height="24" rx="3.5"></rect></svg>`;
    const tablet = `<svg width="${s * 0.86}" height="${s}" viewBox="0 0 22 26" stroke-width="${w}"><rect x="1" y="1" width="20" height="24" rx="2.5"></rect></svg>`;
    const duo = `<svg width="${s * 1.1}" height="${s}" viewBox="0 0 28 26" stroke-width="${w}"><rect x="1" y="1" width="26" height="24" rx="3"></rect><path d="M14 2v22" stroke-dasharray="2 2.5"></path></svg>`;
    return `<span style="display:inline-flex;gap:${14 * u}px;align-items:flex-end">${phone}${tablet}${duo}</span>`;
  }

  // 端末の枠の形（端末の画面の幅に対する割合）。iPhone は 6.9 inch の実物（画面の角 62pt / 440pt）、iPad は 13 inch、Duo は角を少し丸く
  const FRAMES = {
    iphone: { bezel: 0.034, radius: 62 / 440, island: { width: 125 / 440, height: 37 / 440, top: 11 / 440 } },
    ipad: { bezel: 0.028, radius: 0.045, island: null },
    duo: { bezel: 0.032, radius: 0.085, island: null },
  };

  // 端末を置く。single は 1 台を中央、pair は 2 台を重ねて、trio は 3 台を並べる。いちばん前の端末（重ねるものを載せる端末）を先頭で返す
  function placeDevices(images, top, bottom) {
    const frame = FRAMES[deviceKind] || FRAMES.iphone;
    const aspect = images[0].naturalWidth / images[0].naturalHeight;
    const available = bottom - top;
    const fit = (maxWidth, maxHeight) => Math.min(maxWidth, maxHeight * aspect);
    // 並べる枚は、端末を大きく見せるため、左右の端からはみ出してよい。余った高さは上下に分ける
    if (slide.layout === "trio") {
      // 中央を前に、左右を少し下げて後ろに
      const width = fit(W * 0.62, available * 0.94);
      const y = top + Math.max(0, (available * 0.94 - width / aspect) / 2);
      const center = device(images[0], W / 2, y, width, 3, 0, frame);
      device(images[1], W / 2 - width * 0.66, y + available * 0.05, width * 0.9, 2, -5, frame);
      device(images[2], W / 2 + width * 0.66, y + available * 0.05, width * 0.9, 2, 5, frame);
      return [center];
    }
    if (slide.layout === "pair") {
      // 左の前に着せ替えたホーム、右の後ろに着せ替えの画面
      const width = fit(W * 0.7, available * 0.93);
      const y = top + Math.max(0, (available * 0.93 - width / aspect) / 2);
      const front = device(images[0], W / 2 - width * 0.24, y, width, 2, -3, frame);
      device(images[1], W / 2 + width * 0.4, y + available * 0.06, width * 0.9, 1, 4, frame);
      return [front];
    }
    const width = fit(W - 80 * u, available);
    return [device(images[0], W / 2, top, width, 1, 0, frame)];
  }

  // 1 台の端末。centerX・top は外枠の位置、width は外枠の幅
  function device(image, centerX, top, width, z, rotate, frame) {
    const bezel = width * frame.bezel;
    const screenWidth = width - 2 * bezel;
    const screenHeight = screenWidth * image.naturalHeight / image.naturalWidth;
    const screenRadius = screenWidth * frame.radius;
    const element = add(`<div class="device" style="left:${centerX - width / 2}px;top:${top}px;width:${width}px;` +
      `height:${screenHeight + 2 * bezel}px;padding:${bezel}px;border-radius:${screenRadius + bezel}px;z-index:${z};` +
      `transform:rotate(${rotate}deg);box-shadow:0 0 0 ${1.5 * u}px var(--brand), 0 ${24 * u}px ${60 * u}px rgba(0,0,0,0.55)">` +
      `<div class="screen" style="border-radius:${screenRadius}px"><img class="base" src="${image.src}"></div></div>`);
    const screen = element.querySelector(".screen");
    // Dynamic Island は Simulator のスクリーンショットに写らないので描く（ライブアクティビティを出している画面には写っているので描かない）
    if (frame.island && slide.island !== false) {
      const islandHeight = screenWidth * frame.island.height;
      add(`<i class="island" style="top:${screenWidth * frame.island.top}px;width:${screenWidth * frame.island.width}px;` +
        `height:${islandHeight}px;border-radius:${islandHeight / 2}px"></i>`, screen);
    }
    return { element, screen, screenWidth, screenHeight, image };
  }

  // Plus の印（王冠と PLUS）。右上に置く
  function drawPlusBadge() {
    const s = 12 * u;
    add(`<div class="plus" style="top:${18 * u}px;right:${18 * u}px;gap:${5 * u}px;padding:${6 * u}px ${12 * u}px;` +
      `border-radius:${999 * u}px;font-size:${s}px;z-index:10">` +
      `<svg viewBox="0 0 24 24" width="${13 * u}" height="${13 * u}" aria-hidden="true"><path d="M3 18h18l-1.5-10-5 4L12 5l-2.5 7-5-4z"></path></svg>PLUS</div>`);
  }

  // MARK: - ホーム画面・ロック画面に重ねるもの

  // 撮った画面の 1pt あたりの、端末の画面の上の px。ホーム画面のアイコンの位置（pt）から決める
  function pointScale(target) {
    const layout = window.HOME_LAYOUT;
    const screenPoints = layout ? layout.screen.width : target.image.naturalWidth / 3;
    return target.screenWidth / screenPoints;
  }

  // ホーム画面のアイコンの並び（1 ページ目）。行の上端と列の中心（pt）。
  // アイコンの枠はラベルを含み、ラベルが長いと幅が広がるので、列は中心で、アイコンの幅はいちばん狭い枠の幅で決める
  function iconGrid() {
    const layout = window.HOME_LAYOUT;
    if (!layout || layout.icons.length < 1) {
      throw new Error("ホーム画面のアイコンの位置（raw/layout.js）がありません");
    }
    // ドックのアイコン（iPhone・iPad は画面の下の 2 割、iPhone Duo の外側の画面は右の 2 割）と、
    // ほかのページの縮んだアイコン（幅 40pt 未満）は除く
    const icons = layout.icons.filter((icon) => icon.width >= 40 && icon.y < layout.screen.height * 0.8
      && icon.x + icon.width < layout.screen.width * 0.8);
    if (icons.length === 0) {
      throw new Error("ホーム画面のアイコンの位置（raw/layout.js）に、使えるアイコンがありません");
    }
    // アイコンの枠はラベルを含むので、幅と高さの小さいほうをアイコンの大きさとみなす
    const iconWidth = Math.min(...icons.map((icon) => Math.min(icon.width, icon.height)));
    const iconHeight = Math.min(...icons.map((icon) => icon.height));
    // 同じ行・列でも 1pt ほどずれるので、アイコンの幅の半分より近い値は 1 つにまとめる
    const cluster = (values) => values.sort((a, b) => a - b).reduce((groups, value) => {
      const last = groups[groups.length - 1];
      if (last && value - last[last.length - 1] < iconWidth / 2) {
        last.push(value);
      } else {
        groups.push([value]);
      }
      return groups;
    }, []).map((group) => group.reduce((sum, value) => sum + value, 0) / group.length);
    const rows = cluster(icons.map((icon) => icon.y));
    const centers = cluster(icons.map((icon) => icon.x + icon.width / 2));
    // 列が 1 つしかなければ（iPhone Duo）、列の間隔はアイコンとラベルの高さとほぼ同じ（iPhone Duo の外側の画面で 88pt）と見積もる
    const columnPitch = centers.length > 1 ? (centers[centers.length - 1] - centers[0]) / (centers.length - 1) : iconHeight * 1.02;
    // 行が 1 つしかなければ（iPhone Duo）、iPhone の比（行の間隔はアイコンとラベルの高さの 1.15 倍）で見積もる
    const rowPitch = rows.length > 1 ? (rows[rows.length - 1] - rows[0]) / (rows.length - 1) : iconHeight * 1.15;
    // テストのランナー（OshiConUITests-Runner）のアイコンの行から覆う。見つからなければいちばん下の行から
    const runner = icons.find((icon) => /UITests|Runner/.test(icon.label || ""));
    const nearestRow = (y) => rows.reduce((best, row) => (Math.abs(row - y) < Math.abs(best - y) ? row : best), rows[0]);
    const anchorRow = runner ? nearestRow(runner.y) : rows[rows.length - 1];
    return { rows, firstCenter: centers[0], columnPitch, rowPitch, iconWidth, anchorRow };
  }

  // ウィジェットを、テストのランナーのアイコンの行から数えて row 行目・column 列目から、columns 列の幅で置く（高さは描き出した画像の縦横比）。
  // 上のアイコンの行はそのまま見せ、ランナーのアイコン（アプリの並びは実行ごとに変わる）の行からは覆う。
  // ウィジェットの高さはアイコンとラベルより高いので、覆った行のラベルははみ出さない
  async function placeWidget(target, file, column, row, columns) {
    const grid = iconGrid();
    const scale = pointScale(target);
    const image = await load(`surfaces/${file}.png`);
    const left = grid.firstCenter + grid.columnPitch * column - grid.iconWidth / 2;
    // 右の端は画面の中に収め、iPhone Duo の外側の画面では右の帯（時刻・ライブアクティビティ・ドック）にかけない
    const rightLimit = window.HOME_LAYOUT.screen.width * (deviceKind === "duo" ? 0.8 : 0.97);
    const width = Math.min(grid.columnPitch * (columns - 1) + grid.iconWidth, rightLimit - left);
    const height = width * image.naturalHeight / image.naturalWidth;
    const top = grid.anchorRow + grid.rowPitch * row;
    add(`<img class="overlay" src="${image.src}" style="left:${left * scale}px;top:${top * scale}px;` +
      `width:${width * scale}px;height:${height * scale}px">`, target.screen);
    concealOverflowingLabels(target, { left, top, right: left + width, bottom: top + height }, scale);
  }

  // ウィジェットで一部だけ覆ったアイコンの、はみ出した部分をぼかして隠す。長いラベル（テストのランナーの名前など）は左右に、
  // 2 行目のアイコンのラベルは下にはみ出す（ウィジェットの高さは 2 行ぶんのアイコンとラベルより低い）
  function concealOverflowingLabels(target, widget, scale) {
    const pad = 6;
    for (const icon of window.HOME_LAYOUT.icons) {
      const right = icon.x + icon.width, bottom = icon.y + icon.height;
      const overlaps = icon.x < widget.right && right > widget.left && icon.y < widget.bottom && bottom > widget.top;
      if (!overlaps) {
        continue;
      }
      // [左, 上, 右, 下]（pt）。外側にだけ余白を足し、ウィジェットにはかけない
      const strips = [
        [icon.x - pad, icon.y - pad, Math.min(right, widget.left), bottom + pad],
        [Math.max(icon.x, widget.right), icon.y - pad, right + pad, bottom + pad],
        [icon.x - pad, Math.max(icon.y, widget.bottom), right + pad, bottom + pad],
      ];
      for (const [left, top, stripRight, stripBottom] of strips) {
        if (stripRight - left > pad + 0.5 && stripBottom - top > pad + 0.5) {
          add(`<i class="overlay" style="left:${left * scale}px;top:${top * scale}px;` +
            `width:${(stripRight - left) * scale}px;height:${(stripBottom - top) * scale}px;` +
            `backdrop-filter:blur(${10 * scale}px);-webkit-backdrop-filter:blur(${10 * scale}px);` +
            `border-radius:${pad * scale}px"></i>`, target.screen);
        }
      }
    }
  }

  // ロック画面のアクセサリ。時計の下に、丸と長方形を並べる（大きさは HIG の 6.9 inch の iPhone の pt、高さの位置はロック画面の時計の下）
  function placeAccessories(target) {
    const scale = pointScale(target);
    const centerX = target.screenWidth / 2;
    const topOfRow = target.screenHeight * 0.262;
    const circle = 76 * scale, rectangle = { width: 172 * scale, height: 76 * scale }, gap = 12 * scale;
    const total = circle + gap + rectangle.width;
    add(`<img class="overlay" src="surfaces/lock-circular.png" style="left:${centerX - total / 2}px;top:${topOfRow}px;width:${circle}px">`, target.screen);
    add(`<img class="overlay" src="surfaces/lock-rectangular.png" style="left:${centerX - total / 2 + circle + gap}px;top:${topOfRow}px;width:${rectangle.width}px">`, target.screen);
  }

  const OVERLAYS = {
    // ランナーのアイコンの行から、中のウィジェット 1 つ（2 行ぶん）と、その下に小を 2 つ並べる
    async homeWidgets(target) {
      await placeWidget(target, "widget-upcoming-medium", 0, 0, 4);
      await placeWidget(target, "widget-countdown-small", 0, 2, 2);
      await placeWidget(target, "widget-countdown-small-2", 2, 2, 2);
    },
    async photoWidgets(target) {
      await placeWidget(target, "widget-photo-medium", 0, 0, 4);
      await placeWidget(target, "widget-photo-small", 0, 2, 2);
      await placeWidget(target, "widget-photo-small-2", 2, 2, 2);
    },
    async lockAccessories(target) {
      placeAccessories(target);
    },
    // ロック画面の下のほうに、通知を 3 件積む（iOS のロック画面と同じく、地をぼかした角丸の札）
    async lockNotifications(target) {
      const scale = pointScale(target);
      const images = await Promise.all([1, 2, 3].map((index) => load(`surfaces/notification-${index}.png`)));
      // 描き出した倍率（AppStoreSurfaceRenderingTests は 3 倍）から pt に直す
      const sizes = images.map((image) => ({ width: image.naturalWidth / 3, height: image.naturalHeight / 3 }));
      const gap = 8;
      const total = sizes.reduce((sum, size) => sum + size.height, 0) + gap * (sizes.length - 1);
      const screenPoints = target.screenHeight / scale;
      let top = screenPoints * 0.86 - total;
      images.forEach((image, index) => {
        const { width, height } = sizes[index];
        const left = (target.screenWidth / scale - width) / 2;
        const box = `left:${left * scale}px;top:${top * scale}px;width:${width * scale}px;height:${height * scale}px;`;
        add(`<i class="overlay" style="${box}border-radius:${24 * scale}px;` +
          `backdrop-filter:blur(${18 * scale}px) saturate(1.4);-webkit-backdrop-filter:blur(${18 * scale}px) saturate(1.4)"></i>`, target.screen);
        add(`<img class="overlay" src="${image.src}" style="${box}">`, target.screen);
        top += height + gap;
      });
    },
    // ホーム画面の上の端に、通知のバナーを 1 つ重ねる（iPhone Duo。右の帯にかからない幅にする）
    async bannerNotification(target) {
      const scale = pointScale(target);
      const image = await load("surfaces/notification-1.png");
      const screenPoints = target.screenWidth / scale;
      const width = Math.min(image.naturalWidth / 3, screenPoints * 0.78);
      const height = width * image.naturalHeight / image.naturalWidth;
      const left = 10, top = 10;
      const box = `left:${left * scale}px;top:${top * scale}px;width:${width * scale}px;height:${height * scale}px;`;
      add(`<i class="overlay" style="${box}border-radius:${24 * scale * width / (image.naturalWidth / 3)}px;` +
        `backdrop-filter:blur(${18 * scale}px) saturate(1.4);-webkit-backdrop-filter:blur(${18 * scale}px) saturate(1.4)"></i>`, target.screen);
      add(`<img class="overlay" src="${image.src}" style="${box}">`, target.screen);
    },
  };
</script>
