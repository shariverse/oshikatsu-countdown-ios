<!doctype html>
<!--
  App Store のクリエイティブアセット（プロダクトページのヘッダー / 検索結果）の元。
  scripts/render-creative-assets.sh が Chrome のヘッドレスで開いて実寸で書き出す。直接開くときは
  creative.html?type=header&lang=ja&name=推し活カウントダウン のように指定する。同じフォルダに次のファイルが要る:
    screens/<言語>/<名前>.png  6.9 インチで撮った画面（home-light・detail・oshi-list・share-card・appearance-home）
    fonts/                    Kaisei Decol（日本語の見出し）と Outfit（数字・ラテン文字の見出し）
    icon.png                  アプリアイコン（無ければ載せない）

  方針（https://developer.apple.com/app-store/asset-best-practices/）
  - ヘッダー: 初めて来た人に「推しに会える日まであと何日かを数える」ことだけを伝える。
    端末によって左右が切れるので、文言と前の 3 台は中央に寄せ、外側の 2 台は切れてもよい飾りにする。
  - 検索結果: 何をするアプリかが一目でわかるよう、実際の画面と主な機能を見せる。
  - 実在の人物・作品・他社のロゴ・価格・受賞歴は入れない。文言は短く、言語ごとに書く。
  - 地・模様・書体・端末の枠は、スクリーンショット（docs/app-store/screenshots/screenshots.html）にそろえる。
    テーマ（地雷系・ゴシック。docs/design/themes.md）のダークの地に十字とハートの模様、見出しは日本語だけ Kaisei Decol の太字。
    端末の縁は 1 台ずつ推し色（スクリーンショットの枚ごとの色）にして、ピンクに偏らせない
-->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Kaisei Decol"; font-weight: 700; src: url("fonts/KaiseiDecol-Bold.ttf"); }
  @font-face { font-family: "Kaisei Decol"; font-weight: 400; src: url("fonts/KaiseiDecol-Regular.ttf"); }
  @font-face { font-family: "Outfit"; font-weight: 100 900; src: url("fonts/Outfit-Variable.ttf"); }
  /* 配色はスクリーンショットのピンクの枚（screenshots.html の PALETTES.pink） */
  :root {
    --bg: #120D12;
    --cross: #3A2231;
    --brand: #FF7EB3;
    --on-brand: #3A0A20;
    --title: #FFFFFF;
    --muted: #D6B9C8;
    --glow: rgba(255, 126, 179, 0.24);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
  body {
    color: var(--title);
    font-family: "Outfit", "SF Pro Display", "Hiragino Sans", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body[data-lang="ja"] { font-family: "Kaisei Decol", "Hiragino Mincho ProN", serif; }
  body[data-lang="zh-Hans"] { font-family: "Outfit", "PingFang SC", sans-serif; }
  body[data-lang="zh-Hant"] { font-family: "Outfit", "PingFang TC", sans-serif; }
  body[data-lang="ko"] { font-family: "Outfit", "Apple SD Gothic Neo", sans-serif; }
  body[data-lang="th"] { font-family: "Outfit", "Sukhumvit Set", "Thonburi", sans-serif; }
  /* 韓国語は単語の間に空白を入れるので、単語の途中（音節の間）では折り返さない */
  body[data-lang="ko"] { word-break: keep-all; }

  .canvas { position: relative; width: 100vw; height: 100vh; overflow: hidden; background: var(--bg); }
  .pattern { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* 推し色をほのかに灯す（ヘッダーは下から、検索結果は右の端末のうしろから） */
  .glow { position: absolute; inset: 0; }

  /* 端末。枠の太さ・角の丸みは JavaScript（phone）で端末の幅から決める。縁の色は --edge */
  .phone { position: absolute; background: #050305; }
  .phone .screen { position: relative; overflow: hidden; width: 100%; height: 100%; }
  .phone .screen img { display: block; width: 100%; height: 100%; }
  /* Dynamic Island。Simulator のスクリーンショットには写らないので、画面の上に描く */
  .phone .island { position: absolute; left: 50%; transform: translateX(-50%); background: #000; }

  .headline { position: absolute; left: 0; right: 0; text-align: center; font-weight: 700; letter-spacing: 0.01em; line-height: 1.28; white-space: nowrap; }
  .headline em, .copy .title em { font-style: normal; color: var(--brand); }
  .sub { position: absolute; left: 0; right: 0; text-align: center; color: var(--muted); font-weight: 500; line-height: 1.55; white-space: nowrap; }
  body[data-lang="ja"] .sub { font-weight: 400; }

  .copy { position: absolute; }
  /* 見出しとチップは折り返さず、収まらなければ文字を縮める（fitCopy） */
  .copy .title { font-weight: 700; line-height: 1.28; letter-spacing: 0.01em; white-space: nowrap; }
  .chips { display: flex; flex-direction: column; gap: 0.6em; }
  .chip { display: inline-flex; align-items: center; gap: 0.6em; align-self: flex-start;
    padding: 0.5em 1.05em 0.55em 0.75em; border-radius: 999px; font-weight: 600; color: var(--title); white-space: nowrap;
    background: rgba(255, 255, 255, 0.05); box-shadow: inset 0 0 0 3px rgba(255, 126, 179, 0.55), 0 16px 40px rgba(0, 0, 0, 0.35); }
  body[data-lang="ja"] .chip { font-weight: 700; }
  .chip i { font-style: normal; display: grid; place-items: center; width: 1.5em; height: 1.5em; border-radius: 50%;
    background: var(--brand); color: var(--on-brand); font-family: "Outfit", sans-serif; font-weight: 800; font-size: 0.8em; }
  .brand { position: absolute; display: flex; align-items: center; gap: 0.6em; font-weight: 700; color: var(--title); white-space: nowrap; }
  .brand img { height: 1.9em; border-radius: 22%; box-shadow: 0 0 0 3px rgba(255, 126, 179, 0.35), 0 12px 36px rgba(0, 0, 0, 0.5); }
</style>
</head>
<body>
<div class="canvas" id="canvas"></div>
<script>
  const params = new URLSearchParams(location.search);
  const type = params.get("type") || "header";
  const lang = params.get("lang") || "ja";
  const appName = params.get("name") || "Oshi Countdown";
  document.body.dataset.lang = lang;

  // 言語ごとの文言。header: 見出しと補足、search: 見出しと主な機能 3 つ。<em> は推し色で強調する
  const copy = {
    en: {
      header: { title: "Count down to every <em>oshi</em> moment.", sub: "Lives, birthdays, release days — see how many days are left at a glance." },
      search: { title: "Your <em>fan days</em>,<br>counted down.", chips: ["Countdowns in your oshi's color", "Home Screen widgets", "iPhone and iPad"] },
    },
    // en-GB は en を英国のつづりと言い方（colour・gig）に、es-MX は es と同じ文言（中南米でもそのまま通じる）
    "en-GB": {
      header: { title: "Count down to every <em>oshi</em> moment.", sub: "Gigs, birthdays, release days — see how many days are left at a glance." },
      search: { title: "Your <em>fan days</em>,<br>counted down.", chips: ["Countdowns in your oshi's colour", "Home Screen widgets", "iPhone and iPad"] },
    },
    ja: {
      header: { title: "推しに会える日まで、<em>あと何日</em>？", sub: "ライブ・誕生日・発売日。楽しみな日を推し色で数えよう。" },
      search: { title: "推し活の予定を、<br><em>推し色</em>でカウント。", chips: ["推し色のカウントダウン", "ホーム画面ウィジェット", "iPhone と iPad に対応"] },
    },
    "zh-Hans": {
      header: { title: "距离见到<em>本命</em>还有几天？", sub: "演唱会、生日、发售日——用应援色倒数每个期待的日子。" },
      search: { title: "追星日程，<br>用<em>应援色</em>倒数。", chips: ["应援色倒计时", "主屏幕小组件", "支持 iPhone 和 iPad"] },
    },
    "zh-Hant": {
      header: { title: "距離見到<em>本命</em>還有幾天？", sub: "演唱會、生日、發售日——用應援色倒數每個期待的日子。" },
      search: { title: "追星行程，<br>用<em>應援色</em>倒數。", chips: ["應援色倒數計時", "主畫面小工具", "支援 iPhone 與 iPad"] },
    },
    ko: {
      header: { title: "<em>최애</em>를 만나는 날까지 D-며칠?", sub: "콘서트, 생일, 발매일. 기다리는 날을 최애 컬러로 카운트다운." },
      search: { title: "덕질 일정을<br><em>최애 컬러</em>로 카운트다운.", chips: ["최애 컬러 카운트다운", "홈 화면 위젯", "iPhone·iPad 지원"] },
    },
    fr: {
      header: { title: "Combien de jours avant <em>votre idole</em> ?", sub: "Concerts, anniversaires, sorties : comptez les jours aux couleurs de votre favori." },
      search: { title: "Vos jours de fan,<br><em>à rebours</em>.", chips: ["Compte à rebours en couleur", "Widgets d'écran d'accueil", "iPhone et iPad"] },
    },
    de: {
      header: { title: "Wie lange noch bis zu <em>deinem Star</em>?", sub: "Konzerte, Geburtstage, Releases – zähl die Tage in der Farbe deines Lieblings." },
      search: { title: "Deine Fan-Termine,<br><em>im Countdown</em>.", chips: ["Countdown in Fanfarbe", "Widgets für den Home-Bildschirm", "iPhone und iPad"] },
    },
    es: {
      header: { title: "¿Cuántos días faltan para ver a <em>tu bias</em>?", sub: "Conciertos, cumpleaños, lanzamientos: cuenta los días con el color de tu favorito." },
      search: { title: "Tus días de fan,<br><em>en cuenta regresiva</em>.", chips: ["Cuenta regresiva con su color", "Widgets de inicio", "iPhone y iPad"] },
    },
    "es-MX": {
      header: { title: "¿Cuántos días faltan para ver a <em>tu bias</em>?", sub: "Conciertos, cumpleaños, lanzamientos: cuenta los días con el color de tu favorito." },
      search: { title: "Tus días de fan,<br><em>en cuenta regresiva</em>.", chips: ["Cuenta regresiva con su color", "Widgets de inicio", "iPhone y iPad"] },
    },
    "pt-BR": {
      header: { title: "Quantos dias faltam para ver <em>seu bias</em>?", sub: "Shows, aniversários, lançamentos: conte os dias com a cor do seu favorito." },
      search: { title: "Seus dias de fã,<br><em>em contagem regressiva</em>.", chips: ["Contagem na cor do seu bias", "Widgets na Tela de Início", "iPhone e iPad"] },
    },
    it: {
      header: { title: "Quanti giorni mancano al <em>tuo idolo</em>?", sub: "Concerti, compleanni, uscite: conta i giorni con il colore del tuo preferito." },
      search: { title: "I tuoi giorni da fan,<br><em>in conto alla rovescia</em>.", chips: ["Countdown nel suo colore", "Widget nella schermata Home", "iPhone e iPad"] },
    },
    th: {
      header: { title: "อีกกี่วันจะได้เจอ<em>เมน</em>?", sub: "คอนเสิร์ต วันเกิด วันวางจำหน่าย นับถอยหลังด้วยสีของเมน" },
      search: { title: "ตารางติ่ง<br>นับถอยหลังด้วย<em>สีเมน</em>", chips: ["นับถอยหลังสีเมน", "วิดเจ็ตหน้าจอโฮม", "รองรับ iPhone และ iPad"] },
    },
    id: {
      header: { title: "Berapa hari lagi ketemu <em>bias</em>-mu?", sub: "Konser, ulang tahun, rilisan — hitung mundur dengan warna favoritmu." },
      search: { title: "Jadwal fangirling,<br><em>dihitung mundur</em>.", chips: ["Hitung mundur warna bias", "Widget Layar Utama", "iPhone dan iPad"] },
    },
  }[lang];
  // 文言の無い言語は、背景だけの画像を書き出さないようここで止める（render-creative-assets.sh でも先に確かめる）
  if (!copy) {
    document.body.innerHTML = `<h1 style="color:red;font-size:200px">No copy for "${lang}"</h1>`;
    throw new Error(`creative.html に ${lang} の文言がありません`);
  }

  const canvas = document.getElementById("canvas");
  const W = innerWidth, H = innerHeight;
  const add = (html) => { canvas.insertAdjacentHTML("beforeend", html); return canvas.lastElementChild; };

  // 端末の縁の色（スクリーンショットの枚ごとの色。screenshots.html の PALETTES の brand）
  const EDGE = { pink: "#FF7EB3", orange: "#F5A66B", navy: "#8693F6", green: "#6ABC9D", red: "#FF817D" };

  // 十字とハートの模様（ThemePhotoPlaceholder と同じ形。64 の格子を scale 倍に）
  function drawPattern(scale) {
    const size = 64 * scale;
    add(`<svg class="pattern" aria-hidden="true"><defs><pattern id="pt" width="${size}" height="${size}" patternUnits="userSpaceOnUse">` +
      `<g transform="scale(${scale})"><path d="M16 7v16M8 15h16" stroke="var(--cross)" stroke-width="2.6" stroke-linecap="round" fill="none"></path>` +
      `<path d="M48 55c-6.5-4.3-9.5-7.6-9.5-11.2a4.6 4.6 0 0 1 9.5-1.6 4.6 4.6 0 0 1 9.5 1.6c0 3.6-3 6.9-9.5 11.2z" fill="var(--cross)"></path></g>` +
      `</pattern></defs><rect width="100%" height="100%" fill="url(#pt)"></rect></svg>`);
  }

  // 端末の枠（端末の画面の幅に対する割合）。6.9 inch の iPhone の実物（画面の角 62pt / 440pt）。screenshots.html の FRAMES.iphone と同じ
  const FRAME = { bezel: 0.034, radius: 62 / 440, island: { width: 125 / 440, height: 37 / 440, top: 11 / 440 } };
  // 1 台の端末。centerX・top は外枠の位置、width は外枠の幅、edge は縁の色
  function phone(screen, centerX, top, width, { rotate = 0, z = 1, edge = EDGE.pink, image }) {
    const bezel = width * FRAME.bezel;
    const screenWidth = width - 2 * bezel;
    const screenHeight = screenWidth * image.naturalHeight / image.naturalWidth;
    const screenRadius = screenWidth * FRAME.radius;
    const islandHeight = screenWidth * FRAME.island.height;
    const line = Math.max(3, width * 0.0045);
    return add(`<div class="phone" style="left:${centerX - width / 2}px;top:${top}px;width:${width}px;` +
      `height:${screenHeight + 2 * bezel}px;padding:${bezel}px;border-radius:${screenRadius + bezel}px;z-index:${z};` +
      `transform:rotate(${rotate}deg);box-shadow:0 0 0 ${line}px ${edge}, 0 ${width * 0.06}px ${width * 0.15}px rgba(0, 0, 0, 0.6)">` +
      `<div class="screen" style="border-radius:${screenRadius}px"><img src="${image.src}">` +
      `<i class="island" style="top:${screenWidth * FRAME.island.top}px;width:${screenWidth * FRAME.island.width}px;height:${islandHeight}px;` +
      `border-radius:${islandHeight / 2}px"></i></div></div>`);
  }

  const load = (name) => new Promise((resolve, reject) => {
    const image = new Image();
    image.onload = () => resolve(image);
    image.onerror = () => reject(new Error(`screens/${lang}/${name}.png を読めません`));
    image.src = `screens/${lang}/${name}.png`;
  });

  // 文字の多い言語は見出しを小さくする
  const long = ["fr", "de", "es", "es-MX", "pt-BR", "it", "id"].includes(lang);

  main().catch((error) => {
    document.body.innerHTML = `<h1 style="color:red;font-size:120px">${error.message}</h1>`;
    throw error;
  });

  async function main() {
    await document.fonts.ready;
    if (type === "header") {
      await drawHeader();
    } else {
      await drawSearch();
    }
    document.body.dataset.ready = "true";
  }

  // ヘッダー（21:9）。上の中央に見出しと補足、その下に 5 台を扇に並べ、下の端で切る
  async function drawHeader() {
    drawPattern(2.4);
    add(`<div class="glow" style="background:radial-gradient(ellipse 55% 70% at 50% 108%, var(--glow), transparent 70%)"></div>`);
    const title = add(`<div class="headline" style="top:120px;font-size:${long ? 116 : 132}px">${copy.header.title}</div>`);
    const sub = add(`<div class="sub" style="top:${120 + title.offsetHeight + 18}px;font-size:54px">${copy.header.sub}</div>`);
    fitWidth([title, sub], W * 0.86);
    const [home, detail, oshiList, share, appearance] = await Promise.all(
      ["home-light", "detail", "oshi-list", "share-card", "appearance-home"].map(load));
    const top = sub.getBoundingClientRect().bottom + 90;
    // 外側の 2 台（端末によって切れる）、内側の 2 台、中央の 1 台の順に、奥から置く
    phone("share-card", W / 2 - 1400, top + 250, 520, { rotate: -12, z: 1, edge: EDGE.green, image: share });
    phone("appearance-home", W / 2 + 1400, top + 250, 520, { rotate: 12, z: 1, edge: EDGE.red, image: appearance });
    phone("detail", W / 2 - 740, top + 90, 600, { rotate: -6, z: 2, edge: EDGE.orange, image: detail });
    phone("oshi-list", W / 2 + 740, top + 90, 600, { rotate: 6, z: 2, edge: EDGE.navy, image: oshiList });
    phone("home-light", W / 2, top, 680, { z: 3, edge: EDGE.pink, image: home });
  }

  // 検索結果（3:2）。左に何のアプリかと主な機能、右に実際の画面。
  // 端末を先に置き、うしろの端末の左端の手前までを文言の欄にする（長い言語でも、端末の下に文字が入らないように）
  async function drawSearch() {
    drawPattern(3);
    add(`<div class="glow" style="background:radial-gradient(ellipse 45% 60% at 74% 62%, var(--glow), transparent 72%),` +
      `radial-gradient(ellipse 70% 40% at 50% 112%, rgba(255, 126, 179, 0.14), transparent 70%)"></div>`);
    const [home, detail] = await Promise.all(["home-light", "detail"].map(load));
    const back = phone("detail", W - 1540, 520, 860, { rotate: -6, z: 1, edge: EDGE.orange, image: detail });
    phone("home-light", W - 760, 360, 980, { rotate: 4, z: 2, edge: EDGE.pink, image: home });
    const copyLeft = 250;
    const copyRight = back.getBoundingClientRect().left - 120;
    const brand = add(`<div class="brand" style="left:${copyLeft}px;top:220px;font-size:86px"><img src="icon.png" onerror="this.remove()">${appName}</div>`);
    fitWidth([brand], copyRight - copyLeft);
    const box = add(`<div class="copy" style="left:${copyLeft}px;top:520px;width:${copyRight - copyLeft}px;font-size:${long ? 128 : 150}px">` +
        `<div class="title">${copy.search.title}</div>` +
        `<div class="chips" style="font-size:74px;margin-top:110px">` +
        copy.search.chips.map((c, i) => `<div class="chip"><i>${i + 1}</i>${c}</div>`).join("") +
        `</div></div>`);
    fitCopy(box);
  }

  // 1 行の文字（見出し・補足・アプリ名）が幅に収まるまで、文字を縮める（折り返さない）
  function fitWidth(elements, width) {
    for (const element of elements) {
      const size = parseFloat(element.style.fontSize);
      const overflows = () => {
        const range = document.createRange();
        range.selectNodeContents(element);
        return range.getBoundingClientRect().width > width + 0.5;
      };
      for (let scale = 1; overflows() && scale > 0.5; scale -= 0.02) {
        element.style.fontSize = `${size * scale}px`;
      }
    }
  }

  // 見出しとチップのいちばん長い行が欄に収まるまで、見出しとチップの文字を同じ割合で縮める（折り返さない）
  function fitCopy(box) {
    const chips = box.querySelector(".chips");
    const titleSize = parseFloat(box.style.fontSize);
    const chipSize = parseFloat(chips.style.fontSize);
    const right = box.getBoundingClientRect().right;
    const overflows = () => [...box.querySelectorAll(".title, .chip")].some((item) =>
      item.getBoundingClientRect().left + item.scrollWidth > right + 0.5);
    for (let scale = 1; overflows() && scale > 0.5; scale -= 0.02) {
      box.style.fontSize = `${titleSize * scale}px`;
      chips.style.fontSize = `${chipSize * scale}px`;
    }
  }
</script>
</body>
</html>
