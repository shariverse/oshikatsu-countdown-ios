name: Creative Assets

# App Store のクリエイティブアセット（プロダクトページのヘッダー / 検索結果）を、
# App Store Connect API（App Asset Library）でアップロードする試験用のワークフロー。手動実行のみ。
#
# 画像はアプリアイコン（<プロジェクト名>/AppIcon.icon を Icon Composer の ictool で書き出したもの）と
# アプリ名・サブタイトルから、試験用のものをその場で生成する（リポジトリに大きな画像を置かない）。
# 結果（仕様の一覧・アップロード結果・配置結果）は Job Summary に、API のレスポンスは Artifact に残す。
# 審査への提出は行わないので、提出は App Store Connect の画面から行う。
on:
  workflow_dispatch:
    inputs:
      bundle-id:
        description: 対象アプリの Bundle ID（空なら Configs/Project.xcconfig の APP_BUNDLE_IDENTIFIER）
        type: string
        default: ''
      placement:
        description: 'none: Asset Library に上げるだけ / dedicated: 専用画像をヘッダーと検索結果に配置 / universal: 兼用画像を両方に配置'
        type: choice
        options:
          - none
          - dedicated
          - universal
        default: none

permissions:
  contents: read

env:
  # App Store の掲載文（docs/app-store/listing.md）のアプリ名とサブタイトルにそろえる
  APP_NAME: 推し活カウントダウン
  APP_SUBTITLE: 推しのライブ・誕生日まであと何日？

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Select Xcode
        # Icon Composer（ictool）が入っている Xcode を使う。_build.yml と同じバージョンに固定する
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up environment
        env:
          INPUT_BUNDLE_ID: ${{ inputs.bundle-id }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          bundle_id="$INPUT_BUNDLE_ID"
          if [ -z "$bundle_id" ]; then
            bundle_id=$(sed -n 's/^APP_BUNDLE_IDENTIFIER *= *//p' Configs/Project.xcconfig | tr -d '[:space:]')
          fi
          project=$(basename -s .xcodeproj ./*.xcodeproj)
          {
            echo "BUNDLE_ID=$bundle_id"
            echo "PROJECT_NAME=$project"
            echo "ASSET_DIR=$RUNNER_TEMP/creative-assets"
            echo "OUTPUT_DIR=$RUNNER_TEMP/creative-assets-output"
            echo "API_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey_$APPLE_API_KEY_ID.p8"
          } >> "$GITHUB_ENV"
          echo "bundle_id=$bundle_id project=$project"

      - name: Export app icon
        run: |
          ictool="$(xcode-select -p)/Applications/Icon Composer.app/Contents/Executables/ictool"
          "$ictool" "$PROJECT_NAME/AppIcon.icon" --export-image \
            --output-file "$RUNNER_TEMP/AppIcon.png" \
            --platform iOS --rendition Default --width 1024 --height 1024 --scale 1
          sips -g pixelWidth -g pixelHeight "$RUNNER_TEMP/AppIcon.png"
          echo "ICON_PATH=$RUNNER_TEMP/AppIcon.png" >> "$GITHUB_ENV"

      - name: Generate sample images
        run: |
          swift .github/scripts/creative-assets/generate-sample.swift \
            "$ASSET_DIR" \
            "$ICON_PATH" \
            "$APP_NAME" \
            "$APP_SUBTITLE"
          for f in "$ASSET_DIR"/*; do sips -g pixelWidth -g pixelHeight -g hasAlpha "$f"; done

      - name: Upload sample images to GitHub
        uses: actions/upload-artifact@v7
        with:
          name: creative-assets
          path: ${{ env.ASSET_DIR }}
          if-no-files-found: error

      - name: Create API private key
        # Secrets はシェル展開ではなく env 経由で渡す
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          mkdir -p "$(dirname "$API_KEY_PATH")"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$API_KEY_PATH"

      - name: Upload to App Store Connect
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          PLACEMENT: ${{ inputs.placement }}
        run: ruby .github/scripts/creative-assets/upload-creative-assets.rb

      - name: Upload API responses to GitHub
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: creative-assets-api-responses
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: ignore
