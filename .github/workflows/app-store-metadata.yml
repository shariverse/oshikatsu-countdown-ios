name: App Store Metadata

# App Store の掲載文（docs/app-store/metadata/<言語>.md・review-notes.md）・マーケティング URL（docs/app-store/listing.md）・このバージョンの新機能（docs/app-store/whats-new/<バージョン>.md）と
# スクリーンショットを、App Store Connect API で App Store バージョンに登録する。手動実行のみ。
#
# 表示サイズと機種は docs/app-store/screenshots.json、言語は docs/app-store/languages.json で決める。
# スクリーンショットは表示サイズごとに別のジョブで並行して、scripts/app-store-screenshots.sh で撮り、見出しと端末の枠を付けた 10 枚にする
# （リポジトリに大きな画像を置かない。見出しを付けるのに Google Chrome を使う）。撮るのが遅い表示サイズ（screenshots.json の jobPerLanguage）は、言語ごとにも分ける。
# iPhone Duo は GitHub の標準イメージ xcode-27 で撮る（Xcode 27 と iOS 27.1 のランタイムが要る。ランタイムは scripts/app-store-screenshots.sh が入れる）。
# クリエイティブアセット（プロダクトページのヘッダー / 検索結果）は、6.9 インチのスクリーンショットから scripts/render-creative-assets.sh で書き出し、
# App Asset Library に上げて言語ごとのローカリゼーションに配置する。creative_from_run に前の実行の ID（カンマ区切りで複数）を入れると、撮り直さずに
# その実行の 6.9 インチのスクリーンショットから書き出す（デザインだけを変えたとき）。
# サポート URL・プライバシーポリシー URL・著作権・連絡先・カテゴリなどは入れないので、App Store Connect の画面で入れる。
# 審査への提出は行わないので、提出は App Store Connect の画面から行う。
on:
  workflow_dispatch:
    inputs:
      display_types:
        description: '撮る表示サイズ（カンマ区切り）。空なら screenshots.json の全サイズ（APP_IPHONE_67 / APP_IPHONE_61 / APP_IPAD_PRO_3GEN_129 / APP_IPHONE_DUO）'
        type: string
        default: ''
      languages:
        description: '登録する言語（カンマ区切り）。空なら languages.json の全言語'
        type: string
        default: ''
      version:
        description: App Store バージョン（空なら Configs/Project.xcconfig の MARKETING_VERSION）
        type: string
        default: ''
      screenshots:
        description: スクリーンショットを撮って差し替える
        type: boolean
        default: true
      creative_assets:
        description: ヘッダー / 検索結果のクリエイティブアセットを書き出して配置する（6.9 インチのスクリーンショットを撮るとき、または creative_from_run を入れたとき）
        type: boolean
        default: true
      creative_from_run:
        description: クリエイティブアセットの元にする 6.9 インチのスクリーンショットを撮った、前の実行の ID（カンマ区切りで複数。空ならこの実行で撮ったもの）
        type: string
        default: ''
      upload:
        description: App Store Connect に登録する（外すと撮るだけ）
        type: boolean
        default: true
      parallel:
        description: 実行中の回を待たずに動かす（languages が、実行中の回の言語と 1 つも重ならないときだけ。表示サイズが違っても、同じ言語は並べない）
        type: boolean
        default: false

permissions:
  contents: read

# 同じスクリーンショットを同時に消して上げ直さないよう、1 回ずつ流す。parallel を入れた回だけ、実行ごとの別のグループにして待たない。
# 登録のジョブはどの回も languages の掲載文を書くので、言語が 1 つでも重なる回は並べない（表示サイズが違っても、同じ言語の掲載文を
# 同時に書くと、App Store Connect が HTTP 500 を返して止まることがある。2026-11-25 に es-MX・th で起きた）
concurrency:
  group: ${{ github.workflow }}${{ inputs.parallel && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: false

jobs:
  plan:
    # App Store Connect にアプリが無いリポジトリでは、リポジトリ変数 ENABLE_DELIVERY=false でスキップする（upload.yml と同じ）
    if: vars.ENABLE_DELIVERY != 'false'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve display types and languages
        id: matrix
        env:
          DISPLAY_TYPES: ${{ inputs.display_types }}
          LANGUAGES: ${{ inputs.languages }}
          SCREENSHOTS: ${{ inputs.screenshots }}
        run: |
          set -euo pipefail
          # 言語の指定ミスは、撮影（macOS のランナーで数十分）の前にここで落とす
          jq -e --arg wanted "$LANGUAGES" '
            ($wanted | split(",") | map(select(. != ""))) - (.languages | map(.language))
            | if length > 0 then error("languages.json に無い言語: \(join(","))") else true end' docs/app-store/languages.json
          if [ "$SCREENSHOTS" != "true" ]; then
            echo 'matrix=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          all_languages=$(jq -c --arg wanted "$LANGUAGES" '
            ($wanted | split(",") | map(select(. != ""))) as $w
            | if ($w | length) == 0 then .languages | map(.language) else $w end' docs/app-store/languages.json)
          # jobPerLanguage の表示サイズ（撮るのが遅い iPhone Duo）は、1 つのジョブの上限の時間に収まるよう言語ごとに別のジョブにする。
          # Artifact も言語ごとに分け、登録のジョブが screenshots-* をまとめて読む
          matrix=$(jq -c --arg wanted "$DISPLAY_TYPES" --arg languages "$LANGUAGES" --argjson all_languages "$all_languages" '
            ($wanted | split(",") | map(select(. != ""))) as $w
            | .displayTypes
            | (if ($w | length) == 0 then keys_unsorted else $w end) as $types
            | ($types - keys) as $unknown
            | if ($unknown | length) > 0 then error("screenshots.json に無い表示サイズ: \($unknown | join(","))") else . end
            | [$types[] as $t | .[$t] as $d
              | {display_type: $t, runs_on: $d.runsOn, xcode_version: $d.xcodeVersion} as $job
              | if $d.jobPerLanguage then
                  $all_languages[] as $l
                  | $job + {label: "\($d.label) (\($l))", languages: $l, artifact: "screenshots-\($t)-\($l)"}
                else
                  $job + {label: $d.label, languages: $languages, artifact: "screenshots-\($t)"}
                end]' docs/app-store/screenshots.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  screenshots:
    name: ${{ matrix.label }}
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 120
    strategy:
      # 1 つのサイズが失敗しても、ほかのサイズは撮り切って登録する
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      SCREENSHOTS_DIR: ${{ github.workspace }}/build/app-store-screenshots

    steps:
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode_version }}

      - name: Checkout
        uses: actions/checkout@v7

      - name: Allow SwiftLint build tool plugin
        run: defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES

      - name: Take screenshots
        env:
          DISPLAY_TYPE: ${{ matrix.display_type }}
          LANGUAGES: ${{ matrix.languages }}
        run: scripts/app-store-screenshots.sh "$DISPLAY_TYPE" "$LANGUAGES"

      - name: Upload screenshots to GitHub
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ env.SCREENSHOTS_DIR }}
          # 途中で失敗しても撮れたぶんは残す
          if-no-files-found: warn

  creative:
    needs: [plan, screenshots]
    # 6.9 インチのスクリーンショットを撮ったとき（撮影が一部失敗しても、撮れていれば書き出す）か、前の実行のものを使うとき
    if: ${{ always() && inputs.creative_assets && needs.plan.result == 'success' && (inputs.creative_from_run != '' || contains(needs.plan.outputs.matrix, 'APP_IPHONE_67')) }}
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # 前の実行の Artifact を読む
      actions: read

    steps:
      - name: Select Xcode
        # アイコンを書き出す Icon Composer（ictool）が入っている Xcode を使う
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Checkout
        uses: actions/checkout@v7

      - name: Download 6.9 inch screenshots
        if: ${{ inputs.creative_from_run == '' }}
        uses: actions/download-artifact@v8
        with:
          name: screenshots-APP_IPHONE_67
          path: ${{ runner.temp }}/app-store-screenshots

      - name: Download 6.9 inch screenshots from earlier runs
        # 言語を分けて撮った回が複数あるときは、それぞれの Artifact を 1 つのフォルダにまとめる（言語のフォルダは重ならない）
        if: ${{ inputs.creative_from_run != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_IDS: ${{ inputs.creative_from_run }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/app-store-screenshots"
          for run_id in ${RUN_IDS//,/ }; do
            [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "::error::creative_from_run は実行の ID（数字）をカンマ区切りで入れてください: ${run_id}"; exit 1; }
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name screenshots-APP_IPHONE_67 --dir "$RUNNER_TEMP/earlier-runs/$run_id"
            cp -R "$RUNNER_TEMP/earlier-runs/$run_id/." "$RUNNER_TEMP/app-store-screenshots/"
          done
          find "$RUNNER_TEMP/app-store-screenshots" -mindepth 2 -maxdepth 2 -type d | sort

      - name: Render creative assets
        # この実行で撮ったものは、撮れた言語をすべて書き出す（撮れなかった言語があっても止めない）。
        # 前の実行のものは、languages を入れればその言語だけ（1 つの言語だけやり直すとき）、空ならその実行で撮った言語をすべて書き出す
        env:
          LANGUAGES: ${{ inputs.creative_from_run != '' && inputs.languages || '' }}
        run: scripts/render-creative-assets.sh "$RUNNER_TEMP/app-store-screenshots/APP_IPHONE_67" "$RUNNER_TEMP/creative-assets" "$LANGUAGES"

      - name: Upload creative assets to GitHub
        uses: actions/upload-artifact@v7
        with:
          name: creative-assets
          path: ${{ runner.temp }}/creative-assets
          if-no-files-found: error

  upload:
    needs: [plan, screenshots, creative]
    # スクリーンショットを撮らないとき（screenshots ジョブが飛ばされたとき）や、一部のサイズが失敗したときも、撮れたぶんと掲載文は登録する
    if: ${{ always() && inputs.upload && needs.plan.result == 'success' }}
    # 透過のある PNG を JPEG にするのに sips を使うので macOS で動かす
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up environment
        env:
          INPUT_VERSION: ${{ inputs.version }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          version="$INPUT_VERSION"
          if [ -z "$version" ]; then
            version=$(sed -n 's/^MARKETING_VERSION *= *//p' Configs/Project.xcconfig | tr -d '[:space:]')
          fi
          bundle_id=$(sed -n 's/^APP_BUNDLE_IDENTIFIER *= *//p' Configs/Project.xcconfig | tr -d '[:space:]')
          {
            echo "VERSION=$version"
            echo "BUNDLE_ID=$bundle_id"
            echo "API_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey_$APPLE_API_KEY_ID.p8"
          } >> "$GITHUB_ENV"
          echo "bundle_id=$bundle_id version=$version"

      - name: Download screenshots
        if: ${{ inputs.screenshots }}
        uses: actions/download-artifact@v8
        with:
          pattern: screenshots-*
          merge-multiple: true
          path: ${{ runner.temp }}/app-store-screenshots

      - name: Set screenshot directory
        if: ${{ inputs.screenshots }}
        run: |
          echo "SCREENSHOT_DIR=$RUNNER_TEMP/app-store-screenshots" >> "$GITHUB_ENV"
          find "$RUNNER_TEMP/app-store-screenshots" -name '[0-9][0-9].png' | sort

      - name: Create API private key
        # Secrets はシェル展開ではなく env 経由で渡す
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          mkdir -p "$(dirname "$API_KEY_PATH")"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$API_KEY_PATH"

      - name: Upload to App Store Connect
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          LANGUAGES: ${{ inputs.languages }}
        run: ruby .github/scripts/app-store-metadata/upload-app-store-metadata.rb

      - name: Download creative assets
        id: creative
        if: ${{ needs.creative.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: creative-assets
          path: ${{ runner.temp }}/creative-assets

      - name: Place creative assets
        # 掲載文の登録でローカリゼーションができてから配置する
        if: ${{ steps.creative.outcome == 'success' }}
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          ASSET_DIR: ${{ runner.temp }}/creative-assets
          OUTPUT_DIR: ${{ runner.temp }}/creative-assets-output
          PLACEMENT: dedicated
        run: ruby .github/scripts/creative-assets/upload-creative-assets.rb

      - name: Upload API responses to GitHub
        if: ${{ always() && steps.creative.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: creative-assets-api-responses
          path: ${{ runner.temp }}/creative-assets-output
          if-no-files-found: ignore
