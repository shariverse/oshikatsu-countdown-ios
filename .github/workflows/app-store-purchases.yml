name: App Store In-App Purchases

# 課金の商品（docs/app-store/in-app-purchases.json）を、App Store Connect API で登録する。手動実行のみ。
# 既定は確認だけで、何も作らない（productId は一度作ると変えられないため、まず確認の結果を見てから apply で作る）。
# 審査用のスクリーンショットと審査への提出は扱わないので、App Store Connect の画面で行う。
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 商品を作る・表示名や価格を入れる（外すと確認だけ）
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  register:
    # App Store Connect にアプリが無いリポジトリでは、リポジトリ変数 ENABLE_DELIVERY=false でスキップする（upload.yml と同じ）
    if: vars.ENABLE_DELIVERY != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up environment
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          bundle_id=$(sed -n 's/^APP_BUNDLE_IDENTIFIER *= *//p' Configs/Project.xcconfig | tr -d '[:space:]')
          {
            echo "BUNDLE_ID=$bundle_id"
            echo "API_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey_$APPLE_API_KEY_ID.p8"
          } >> "$GITHUB_ENV"
          echo "bundle_id=$bundle_id"

      - name: Create API private key
        # Secrets はシェル展開ではなく env 経由で渡す
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          mkdir -p "$(dirname "$API_KEY_PATH")"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$API_KEY_PATH"

      - name: Register in-app purchases
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLY: ${{ inputs.apply }}
        run: ruby .github/scripts/app-store-purchases/register-in-app-purchases.rb
