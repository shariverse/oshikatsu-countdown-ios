name: Upload

# develop / release/** への push で Archive → IPA Export → App Store Connect へアップロードする。
# 作業ブランチを TestFlight で確認したいときは、手動実行（workflow_dispatch）でそのブランチを選ぶ。
# 作業ブランチの push ごとに上げると、App Store Connect の 24 時間あたりのアップロード上限に当たるため自動では上げない。
on:
  push:
    branches:
      - develop
      - 'release/**'
    # docs/spec/ は仕様リポジトリ app-specs から生成した仕様で、Bot の spec-sync の PR で届く（届いたらすぐマージする）。
    # 仕様だけの変更ではアプリは変わらないので、アップロードしない（24 時間あたりのアップロード上限と macOS の実行枠を使わないため）。
    # ほかのファイルも一緒に変わった push では、今までどおりアップロードする
    paths-ignore:
      - 'docs/spec/**'
  workflow_dispatch:

permissions:
  contents: read

# アップロード途中でキャンセルすると App Store Connect 側に中途半端なビルドが残るため、
# 実行中のものは完了させる
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upload:
    # テンプレートリポジトリ自身など、App Store Connect にアプリが無いリポジトリではリポジトリ変数 ENABLE_DELIVERY=false でスキップする。
    # Archive（手動実行で IPA Export まで確認する）はアプリが無くても通るので止めない
    if: vars.ENABLE_DELIVERY != 'false'
    uses: ./.github/workflows/_archive.yml
    with:
      upload: true
    secrets: inherit
